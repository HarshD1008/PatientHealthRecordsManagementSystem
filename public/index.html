<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('https://www.transparenttextures.com/patterns/soft-light.png');
            background-repeat: repeat;
        }

        .container {
            width: 80%;
            max-width: 1000px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 40px;
            color: #2f4f4f;
        }

        .card-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .card {
            width: 48%;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: white;
            text-align: center;
        }

        .card h3 {
            margin-bottom: 20px;
            color: #2f4f4f;
        }

        .card img {
            display: block;
            margin: 0 auto;
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }

        .card button {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .card button:hover {
            background-color: #45a049;
        }

        .hospital-symbol {
            font-size: 40px;
            margin-bottom: 20px;
            color: #d9534f;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Health Management System</h1>

        <div class="card-container">
            <!-- User Card -->
            <div class="card">
                <h3>User</h3>
                <img src="https://www.w3schools.com/w3images/avatar2.png" alt="User Logo">
                <button>Login</button>
                <button onclick ="location.href='./register.html'">Sign Up</button>
            </div>

            <!-- Hospital Card -->
            <div class="card">
                <h3>Hospital</h3>
                <div class="hospital-symbol">🏥</div>
                <button onclick ="location.href='./hportal.html'">Find  User</button>
                <button onclick ="location.href='./hportal.html'">Login</button>
            </div>
        </div>
    </div>

</body>
</html>
