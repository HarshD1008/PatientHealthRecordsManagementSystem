<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients Record and Updates</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }

        /* Header Styling */
        header {
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        /* Main content styling */
        main {
            padding: 20px;
        }

        /* Form container styling */
        .form-container {
            max-width: 800px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        /* Label styling */
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        /* Input and textarea styling */
        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        /* Textarea specific styling */
        textarea {
            height: 100px;
            resize: none;
        }

        /* Submit button styling */
        button {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        /* Media Query for Tablet and Larger Screens */
        @media (min-width: 768px) {
            .form-container {
                padding: 30px;
            }

            h2 {
                font-size: 24px;
            }

            input[type="text"], textarea, input[type="file"] {
                font-size: 18px;
            }

            button {
                font-size: 20px;
            }
        }

        /* Media Query for Laptop and Desktop Screens */
        @media (min-width: 1024px) {
            .form-container {
                padding: 40px;
            }

            h2 {
                font-size: 28px;
            }

            input[type="text"], textarea, input[type="file"] {
                font-size: 20px;
            }

            button {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Patients Record and Updates</h1>
    </header>

    <main>
        <div class="form-container">
            <h2>Update Patient Information</h2>

            <form action="" method="post" enctype="multipart/form-data">

                <!-- Medication Update -->
                <label for="medication">Update Medication:</label>
                <textarea id="medication" name="medication" required placeholder="Enter new medication information..."></textarea>

                <!-- Doctor's Notes -->
                <label for="doctor-notes">Doctor's Notes:</label>
                <textarea id="doctor-notes" name="doctor-notes" required placeholder="Enter any notes or comments..."></textarea>

                <!-- File Upload -->
                <label for="patient-documents">Upload Patient Documents:</label>
                <input type="file" id="patient-documents" name="patient-documents" accept=".pdf, .doc, .docx, .jpg, .jpeg, .png" required>

                <!-- Submit Button -->
                <button type="submit">Save Updates</button>
            </form>
        </div>
    </main>

</body>
</html>
